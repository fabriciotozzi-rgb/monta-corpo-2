<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monta-Corpo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ff82bb; --panel:#fff3f9; --panel2:#ffe0ef; --ink:#6b1f4f; --mute:#a2487f;
  --edge:#8a2b63; --board:#f0539a; --gold:#ffd84d; --btn-ink:#5a1840;
  --ok:#1fae72; --err:#e5384a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#6d2a5a; --panel:#43183a; --panel2:#52204a; --ink:#ffe6f2; --mute:#e7a6cb;
    --edge:#1f0a1a; --board:#a63a78; --ok:#5fe0a2; --err:#ff6b7d;
  }
}
:root[data-theme="dark"]{
  --bg:#6d2a5a; --panel:#43183a; --panel2:#52204a; --ink:#ffe6f2; --mute:#e7a6cb;
  --edge:#1f0a1a; --board:#a63a78; --ok:#5fe0a2; --err:#ff6b7d;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0}
body{
  height:100%;background-color:var(--bg);background-image:var(--bgimg,none);background-size:var(--bgsize,auto);image-rendering:pixelated;color:var(--ink);
  font-family:'VT323','Courier New',monospace;font-size:21px;line-height:1.1;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{
  height:100%;display:grid;gap:10px;padding:10px;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"head" "tabs" "board" "msg" "tray";
}
@media (min-width:880px), (min-width:640px) and (orientation:landscape){
  .app{
    padding:16px;gap:12px;grid-template-columns:minmax(0,1fr) 400px;
    grid-template-rows:auto auto auto minmax(0,1fr);
    grid-template-areas:"board head" "board tabs" "board msg" "board tray";
  }
  .list{flex-wrap:wrap;overflow-x:hidden !important;overflow-y:auto;align-content:flex-start;flex:1;min-height:0}
}

/* cabeçalho */
.head{grid-area:head;display:grid;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand canvas{width:26px;image-rendering:pixelated}
h1{font:400 14px/1 'Press Start 2P',monospace;margin:0}
.lives{margin-left:auto;display:flex;gap:4px}
.lives canvas{width:20px;height:auto;image-rendering:pixelated}
.lives canvas.lost{filter:grayscale(1) brightness(.6);opacity:.35}
.count{font:400 11px/1 'Press Start 2P',monospace}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:10px;border:2px solid var(--edge);background:var(--panel2)}
.meter i.on{background:var(--c)}
.meter i.gap{margin-left:6px}

/* abas */
.tabs{grid-area:tabs;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{
  font:400 10px/1 'Press Start 2P',monospace;padding:11px 8px;background:var(--panel);
  border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:6px;
}
.tab b{font-weight:400}
.tab[aria-selected="true"]{background:var(--gold);color:var(--btn-ink)}
.tab.nudge{outline:3px dashed var(--ok);outline-offset:3px}

/* tabuleiro */
.board{
  grid-area:board;min-height:0;min-width:0;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background-color:var(--board);
  background-image:radial-gradient(rgba(255,255,255,.28) 1.5px,transparent 2px);
  background-size:10px 10px;
  border:4px solid var(--edge);box-shadow:inset 0 0 0 4px rgba(255,255,255,.08);
}
.board.bad{animation:bad .3s steps(3)}
@keyframes bad{50%{box-shadow:inset 0 0 0 8px var(--err)}}
#cv{display:block;image-rendering:pixelated;touch-action:manipulation;cursor:crosshair}

/* mensagem */
.msg{
  grid-area:msg;background:var(--panel);border:3px solid var(--edge);border-left:10px solid var(--gold);
  box-shadow:0 4px 0 var(--edge);padding:9px 12px;height:124px;overflow:hidden;
}
.msg.ok{border-left-color:var(--ok)}
.msg.err{border-left-color:var(--err)}
.msg h2{font:400 10px/1.3 'Press Start 2P',monospace;margin:0 0 7px}
.msg p{margin:0;font-size:21px;line-height:1.05}
@media (min-width:640px) and (orientation:landscape){ .msg{height:112px} }

/* peças */
.tray{grid-area:tray;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.tray-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font:400 9px/1 'Press Start 2P',monospace}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{
  font:400 9px/1 'Press Start 2P',monospace;padding:9px 8px;background:var(--gold);color:var(--btn-ink);
  border:3px solid var(--edge);box-shadow:0 3px 0 var(--edge);cursor:pointer;
}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn[aria-pressed="false"]{background:var(--panel);color:var(--mute)}
.btn.big{font-size:11px;padding:13px 14px}

.list{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.piece{
  flex:0 0 auto;width:82px;height:104px;padding:5px 2px 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:var(--panel2);border:3px solid var(--edge);box-shadow:0 3px 0 var(--edge);
  cursor:grab;touch-action:pan-x;font:400 14px/.95 'VT323',monospace;text-align:center;overflow:hidden;
}
.piece .art{flex:1;display:flex;align-items:center;justify-content:center}
.piece canvas{image-rendering:pixelated;display:block}
.piece span{display:block;height:2em;overflow:hidden}
.piece.sel{background:var(--gold);color:var(--btn-ink)}
.piece.lifted{opacity:.3}
.piece.shake{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.empty{font-size:21px;padding:10px 4px;color:var(--mute)}
@media (min-width:880px), (min-width:640px) and (orientation:landscape){ .piece{width:88px;height:110px} }

/* vitória */
.win{position:fixed;inset:0;background:rgba(90,20,70,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.win[hidden]{display:none}
.card{background:var(--panel);border:4px solid var(--edge);box-shadow:0 8px 0 var(--edge);padding:22px 20px;max-width:380px;text-align:center}
.card h2{font:400 16px/1.4 'Press Start 2P',monospace;margin:0 0 14px}
.card p{font-size:24px;line-height:1.05;margin:0 0 18px}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.meter i.ok{background:var(--ok)}
.meter i.no{background:var(--err)}
.quiz-card{width:100%;max-width:440px;text-align:left;max-height:100%;overflow:auto}
.q-top{display:flex;justify-content:space-between;gap:8px;font:400 9px/1 'Press Start 2P',monospace;margin-bottom:10px}
.card .q-text{font-size:27px;line-height:1.05;margin:10px 0 16px}
.opts{display:grid;gap:10px}
.opt{font:400 23px/1.05 'VT323',monospace;text-align:left;padding:11px 12px;background:var(--panel2);color:var(--ink);border:3px solid var(--edge);box-shadow:0 3px 0 var(--edge);cursor:pointer}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok);color:#1b1230}
.opt.wrong{background:var(--err);color:#1b1230}
.card .q-fb{font-size:22px;line-height:1.05;margin:16px 0 14px;min-height:3.3em}
.card h2.q-title{font-size:12px;margin:16px 0 0}
.tab,.btn,.piece,.opt{border-radius:10px}
.msg,.card,.board{border-radius:14px}
.meter i{border-radius:3px}
.brand{background:var(--panel);border:3px solid var(--edge);border-radius:10px;box-shadow:0 3px 0 var(--edge);padding:7px 10px}
@media (prefers-reduced-motion: reduce){
  .board.bad,.piece.shake{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="brand"><canvas id="logo" width="13" height="14" aria-hidden="true"></canvas><h1>Monta-Corpo</h1><div class="lives" id="lives" aria-label="Vidas"></div><div class="count"><span id="cnt">0</span>/24</div></div>
    <div class="meter" id="meter" aria-hidden="true"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sistemas do corpo">
    <button class="tab" role="tab" data-sys="orgaos" id="tab-orgaos"><span>Órgãos</span><b id="t-orgaos">0/11</b></button>
    <button class="tab" role="tab" data-sys="esqueleto" id="tab-esqueleto"><span>Esqueleto</span><b id="t-esqueleto">0/13</b></button>
  </nav>

  <main class="board" id="board"><canvas id="cv" aria-label="Silhueta do corpo humano para encaixar as peças" role="img"></canvas></main>

  <section class="msg info" id="msg" aria-live="polite"><h2 id="mt"></h2><p id="mp"></p></section>

  <section class="tray">
    <div class="tray-head">
      <span id="tl">Peças</span>
      <div class="tools">
        <button class="btn" id="b-hint" type="button">Dica</button>
        <button class="btn alt" id="b-reset" type="button">Reiniciar</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="win" id="win" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="w-title">
    <h2 id="w-title">Corpo montado!</h2>
    <p id="wp"></p>
    <div class="row">
      <button class="btn big" id="w-quiz" type="button">Fase 2: Quiz</button>
      <button class="btn big" id="w-redo" type="button">Refazer quiz</button>
      <button class="btn big alt" id="w-again" type="button">Jogar de novo</button>
      <button class="btn big alt" id="w-close" type="button">Ver o corpo</button>
    </div>
  </div>
</div>

<div class="win" id="quiz" hidden>
  <div class="card quiz-card" role="dialog" aria-modal="true" aria-labelledby="q-title">
    <div class="q-top"><span id="q-n">Pergunta 1/10</span><span id="q-s">Acertos: 0</span></div>
    <div class="meter" id="q-meter" aria-hidden="true"></div>
    <h2 class="q-title" id="q-title">Fase 2: Quiz</h2>
    <p class="q-text" id="q-q"></p>
    <div class="opts" id="q-opts"></div>
    <p class="q-fb" id="q-fb" aria-live="polite"></p>
    <button class="btn big" id="q-next" type="button" hidden>Próxima</button>
  </div>
</div>

<script>
(()=>{
'use strict';

/*PURE_START*/
const LW=81, LH=148, OUT='#6b1f4f';

function rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function toHex(a){return'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function mix(c,t,a){const x=rgb(c),y=rgb(t);return toHex(x.map((v,i)=>v+(y[i]-v)*a))}

class Grid{
  constructor(w,h){this.w=w;this.h=h;this.p=new Array(w*h).fill(null);this.d=new Array(w*h).fill(false);this.clip=false}
  set(x,y,c,det=false){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;const i=y*this.w+x;if(this.clip&&this.p[i]===null)return;this.p[i]=c;this.d[i]=det}
  erase(x,y){if(x<0||y<0||x>=this.w||y>=this.h)return;const i=y*this.w+x;this.p[i]=null;this.d[i]=false}
  ellipse(cx,cy,rx,ry,c,det=false){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,c,det)}}
  erased(cx,cy,rx,ry){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.erase(x,y)}}
  rect(x,y,w,h,c,det=false){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c,det)}
  line(x0,y0,x1,y1,t,c,det=false){
    const r=t/2,n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2)+1;
    for(let k=0;k<n;k++){
      const u=n>1?k/(n-1):0,x=x0+(x1-x0)*u,y=y0+(y1-y0)*u;
      for(let py=Math.floor(y-r);py<=Math.ceil(y+r);py++)for(let px=Math.floor(x-r);px<=Math.ceil(x+r);px++){
        const dx=px+.5-x,dy=py+.5-y;if(dx*dx+dy*dy<=r*r)this.set(px,py,c,det)}
    }
  }
}

function finish(g,o={}){
  const pad=o.pad===undefined?1:o.pad, ol=o.outline!==false, sh=o.shade!==false;
  const W=g.w+2*pad,H=g.h+2*pad,px=new Array(W*H).fill(null);
  const fl=(x,y)=>x>=0&&y>=0&&x<g.w&&y<g.h&&g.p[y*g.w+x]!==null;
  for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){
    const i=y*g.w+x,c=g.p[i];if(!c)continue;let cc=c;
    if(sh&&!g.d[i]){
      if(!fl(x-1,y)||!fl(x,y-1))cc=mix(c,'#ffffff',.3);
      else if(!fl(x+1,y)||!fl(x,y+1))cc=mix(c,'#000000',.2);
    }
    px[(y+pad)*W+x+pad]=cc;
  }
  if(ol){
    const snap=px.slice();
    const has=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&snap[y*W+x]!==null;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      if(snap[y*W+x]===null&&(has(x-1,y)||has(x+1,y)||has(x,y-1)||has(x,y+1)))px[y*W+x]=OUT;
    }
  }
  return{w:W,h:H,px};
}
function flip(s){const px=new Array(s.px.length);for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++)px[y*s.w+x]=s.px[y*s.w+(s.w-1-x)];return{w:s.w,h:s.h,px}}

/* ---------- silhueta ---------- */
function makeBody(){
  const g=new Grid(LW,LH),c='#fff0f6';
  g.ellipse(40.5,13.5,11.5,12.5,c);
  g.rect(36,25,9,7,c);
  const K=[[28,10],[31,21],[36,23],[50,22],[64,19],[76,17],[88,19],[98,20],[101,20]];
  for(let y=28;y<=101;y++){
    let hw=20;
    for(let i=0;i<K.length-1;i++){if(y>=K[i][0]&&y<=K[i+1][0]){const t=(y-K[i][0])/(K[i+1][0]-K[i][0]);hw=K[i][1]+(K[i+1][1]-K[i][1])*t;break}}
    for(let x=0;x<LW;x++)if(Math.abs(x-40)<=hw)g.set(x,y,c);
  }
  for(const m of[0,1]){
    const X=v=>m?81-v:v;
    g.line(X(19.5),34.5,X(12.5),66.5,8,c);
    g.line(X(12.5),66.5,X(9.5),92.5,7,c);
    g.ellipse(X(9.5),96,4,4,c);
  }
  const L=[[94,30,10.5],[100,30,10],[114,31,7.5],[119,31,7],[130,32,6.5],[140,32,4.5]];
  for(let y=94;y<=141;y++){
    let xc=32,hw=4.5;
    for(let i=0;i<L.length-1;i++){if(y>=L[i][0]&&y<=L[i+1][0]){const t=(y-L[i][0])/(L[i+1][0]-L[i][0]);xc=L[i][1]+(L[i+1][1]-L[i][1])*t;hw=L[i][2]+(L[i+1][2]-L[i][2])*t;break}}
    for(const m of[0,1]){const xm=m?80-xc:xc;for(let x=0;x<LW;x++)if(Math.abs(x-xm)<=hw)g.set(x,y,c)}
  }
  g.ellipse(29.5,143,7.5,3,c);g.ellipse(51.5,143,7.5,3,c);
  g.ellipse(53.5,7,3.4,2.8,'#ff6fae');g.ellipse(59.5,7,3.4,2.8,'#ff6fae');g.ellipse(56.5,7,1.7,1.7,'#e0338a',true);
  return finish(g,{pad:0});
}

/* ---------- órgãos ---------- */
function sBrain(){
  const g=new Grid(17,9),c='#f7b1cd',d='#d8709f';
  g.ellipse(8.5,4.5,8.5,4.5,c);
  for(let y=1;y<=7;y++)g.set(8,y,d,true);
  [[3,2],[4,2],[2,4],[3,4],[5,4],[4,6],[5,6],[6,3],[6,4]].forEach(([x,y])=>{g.set(x,y,d,true);g.set(16-x,y,d,true)});
  return finish(g);
}
function sLung(notch){
  const g=new Grid(13,22),c='#ff9aa9',b='#e2607c';
  g.ellipse(6.5,11.5,6.5,11,c);
  if(notch)g.erased(14,17.5,6,6);
  g.clip=true;
  g.line(8,2,6.5,8,1,b,true);g.line(6.5,8,4,13,1,b,true);g.line(6.5,8,8,14,1,b,true);
  return finish(g);
}
function sHeart(){
  const g=new Grid(11,12),r='#e5384a';
  g.ellipse(3.5,3.6,3.5,3.6,r);g.ellipse(7.5,3.6,3.5,3.6,r);
  for(let y=4;y<12;y++){const hw=5.5*(12-y)/8;for(let x=0;x<11;x++)if(Math.abs(x+.5-5.5)<=hw)g.set(x,y,r)}
  g.rect(4,0,2,3,'#4a86e0',true);g.rect(6,0,2,3,'#c62d3d',true);
  return finish(g);
}
function sLiver(){
  const g=new Grid(21,10),c='#9c4436';
  for(let x=0;x<21;x++){
    const xm=x+.5,t=xm<=7?(7-xm)/7:(xm-7)/14,hh=5*Math.sqrt(Math.max(0,1-t*t)),cy=5+(xm-7)*.05;
    for(let y=0;y<10;y++)if(Math.abs(y+.5-cy)<=hh)g.set(x,y,c);
  }
  g.rect(11,7,2,2,'#62c25a',true);
  return finish(g);
}
function sStomach(){
  const g=new Grid(13,11),c='#f58a62',d='#d9603f';
  g.ellipse(7,6,5.5,5,c);g.rect(1,0,3,4,c);g.rect(0,7,2,3,c);
  [[5,3],[6,3],[8,5],[9,5],[5,6],[6,6],[8,8],[9,8]].forEach(([x,y])=>g.set(x,y,d,true));
  return finish(g);
}
function sKidney(){
  const g=new Grid(7,10),c='#b04a70';
  g.ellipse(3.5,5,3.5,5,c);g.erased(7.6,5,2,2.4);
  return finish(g);
}
function sSmall(){
  const g=new Grid(17,8),c='#f6a3b6',d='#d27590';
  g.rect(0,0,17,2,c);g.rect(0,3,17,2,c);g.rect(0,6,17,2,c);
  g.rect(15,2,2,1,c);g.rect(0,5,2,1,c);
  [[0,0],[16,0],[0,7],[16,7]].forEach(([x,y])=>g.erase(x,y));
  for(let x=3;x<14;x+=3){g.set(x,0,d,true);g.set(x+1,3,d,true);g.set(x,6,d,true)}
  return finish(g);
}
function sLarge(){
  const g=new Grid(29,15),c='#e6b64f',d='#b78630';
  g.rect(0,0,29,4,c);g.rect(0,0,4,15,c);g.rect(25,0,4,15,c);g.rect(20,11,9,4,c);g.ellipse(2.5,13,3,2.2,c);
  g.erase(0,0);g.erase(28,0);
  for(let x=5;x<24;x+=4){g.set(x,1,d,true);g.set(x,2,d,true)}
  for(let y=5;y<14;y+=4){g.set(1,y,d,true);g.set(2,y,d,true);g.set(26,y,d,true);g.set(27,y,d,true)}
  return finish(g);
}
function sBladder(){
  const g=new Grid(9,8),c='#ffd25c',d='#d9a52a';
  g.ellipse(4.5,4,4.5,3.5,c);g.rect(4,7,1,1,c);
  g.set(1,1,d,true);g.set(7,1,d,true);
  return finish(g);
}

/* ---------- ossos ---------- */
const BONE='#f6eccd';
function sSkull(){
  const g=new Grid(21,22),c='#fbf3dc',k='#4a1838';
  g.ellipse(10.5,9,10.5,9,c);g.ellipse(10.5,14.5,7,5,c);g.rect(7,17,7,4,c);
  g.ellipse(6.5,13.5,2.3,2.3,k,true);g.ellipse(14.5,13.5,2.3,2.3,k,true);
  g.set(10,14,k,true);g.set(9,15,k,true);g.set(10,15,k,true);g.set(11,15,k,true);
  for(let x=6;x<=14;x++)g.set(x,17,k,true);
  for(let x=7;x<=13;x++)g.set(x,18,x%2?'#cfc6a6':'#ffffff',true);
  return finish(g);
}
function sSpine(){
  const g=new Grid(7,60),c='#f1e4bd';
  for(let i=0;i<11;i++){const y=i*5;g.rect(1,y,5,4,c);g.rect(0,y+1,7,2,c)}
  for(let r=0;r<5;r++){const hw=3.5-r*.65;for(let x=0;x<7;x++)if(Math.abs(x+.5-3.5)<=hw)g.set(x,55+r,'#dccb9b')}
  return finish(g);
}
function sRibs(){
  const g=new Grid(37,32),c='#f6edd2',s='#b3a57f';
  const pts=[];
  for(let i=0;i<5;i++){
    const y0=1+i*5,xo=7-i*1.2,P0=[17,y0],P1=[xo+5,y0+1+i*.4],P2=[xo,y0+7];
    for(let t=0;t<=1.0001;t+=.02){
      const a=(1-t)*(1-t),b=2*(1-t)*t,d=t*t;
      pts.push([a*P0[0]+b*P1[0]+d*P2[0],a*P0[1]+b*P1[1]+d*P2[1]]);
    }
  }
  g.rect(17,0,3,21,c);g.rect(17,21,3,1,s,true);
  for(const[x,y]of pts){g.set(x,y+2,s,true);g.set(36-x,y+2,s,true)}
  for(const[x,y]of pts){g.set(x,y,c,true);g.set(x,y+1,c,true);g.set(36-x,y,c,true);g.set(36-x,y+1,c,true)}
  return finish(g,{pad:0,outline:false,shade:false});
}
function sClav(){
  const g=new Grid(35,6);
  for(const m of[0,1]){
    const X=v=>m?34-v:v;
    g.line(X(16.5),4,X(1.5),2,2,BONE);g.ellipse(X(1.8),2.5,1.7,1.7,BONE);
  }
  return finish(g);
}
function sHumerus(){
  const g=new Grid(10,34);
  g.line(6.5,5,3.5,29,3,BONE);g.ellipse(6.5,3.6,3,3,BONE);g.ellipse(3,30.3,3.2,2.6,BONE);
  return finish(g);
}
function sForearm(){
  const g=new Grid(10,28);
  g.line(6.5,2,5.5,25,2,BONE);g.line(2.5,2,2,25,2,BONE);
  g.ellipse(4.5,1.8,4,1.8,BONE);g.ellipse(4,26,3.5,1.8,BONE);
  return finish(g);
}
function sPelvis(){
  const g=new Grid(31,18),c='#f2e7c6';
  for(let y=0;y<18;y++){
    const hw=y<9?15.5-.15*y:14.2-(y-9)*1.35;
    for(let x=0;x<31;x++)if(Math.abs(x+.5-15.5)<=hw)g.set(x,y,c);
  }
  g.erased(15.5,9.5,5,4.2);
  g.rect(14,0,3,9,'#dccb9b');
  g.set(5,11,'#8f8464',true);g.set(25,11,'#8f8464',true);
  return finish(g);
}
function sFemur(){
  const g=new Grid(8,30);
  g.ellipse(5.3,3,2.8,2.8,BONE);g.line(5,4.5,3.8,7.5,2,BONE);g.line(3.8,6.5,2.8,25,3,BONE);g.ellipse(3.3,27,3.3,2.5,BONE);
  return finish(g);
}
function sTibia(){

  g.rect(0,0,6,3,BONE);g.line(3,3,3,20,3,BONE);g.ellipse(3.2,21.5,2.6,2,BONE);
  g.line(6,4,5.8,20,1,'#d9ccaa',true);
  return finish(g);
}

function toCanvas(s,map){
  const c=document.createElement('canvas');c.width=s.w;c.height=s.h;
  const x=c.getContext('2d'),id=x.createImageData(s.w,s.h);
  for(let i=0;i<s.px.length;i++){
    const col=s.px[i];if(!col)continue;
    const v=map(col,i%s.w,(i/s.w)|0);if(!v)continue;
    const r=rgb(v);id.data[i*4]=r[0];id.data[i*4+1]=r[1];id.data[i*4+2]=r[2];id.data[i*4+3]=255;
  }
  x.putImageData(id,0,0);return c;
}

  p.hi=toCanvas(p.s,c=>c===OUT?'#ff3d8f':'#ffe14d');
});

const BM={
 star:['.....X.....','.....X.....','....XXX....','XXXXXXXXXXX','.XXXXXXXXX.','..XXXXXXX..','...XXXXX...','..XXXXXXX..','..XXX.XXX..','.XXX...XXX.','.XX.....XX.'],
 heart:['.XX...XX.','XXXX.XXXX','XXXXXXXXX','XXXXXXXXX','.XXXXXXX.','..XXXXX..','...XXX...','....X....'],
 bow:['.XX.....XX.','XXXX...XXXX','XXXXXXXXXXX','XXXXXXXXXXX','XXXX...XXXX','.XX.....XX.'],
 spark:['..X..','..X..','XXXXX','..X..','..X..']
};
const dq=matchMedia('(prefers-color-scheme: dark)');
function makeBg(){
  const th=document.documentElement.dataset.theme,dark=th==='dark'||(th!=='light'&&dq.matches);
  const P=dark?{base:'#6d2a5a',star:'#a64f8a',h1:'#ffc1de',h2:'#d9709f',bow:'#ff9ccb',sp:'#ffe3f0'}
              :{base:'#ff82bb',star:'#ffcfe5',h1:'#ffffff',h2:'#ffb1d3',bow:'#ffffff',sp:'#ffffff'};
  const TW=72,TH=120,R=Math.max(1,Math.round(window.devicePixelRatio||1)),cell=3*R;
  const t=document.createElement('canvas');t.width=TW;t.height=TH;const x=t.getContext('2d');
  x.fillStyle=P.base;x.fillRect(0,0,TW,TH);
  const put=(m,ox,oy,col)=>{x.fillStyle=col;m.forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]==='X')x.fillRect(((ox+i)%TW+TW)%TW,((oy+j)%TH+TH)%TH,1,1)})};
  [[6,6],[46,44],[14,88]].forEach(([a,b])=>put(BM.star,a,b,P.star));
  [[34,10],[58,22],[4,52],[56,74],[30,70],[42,104],[66,100],[22,36]].forEach(([a,b],i)=>put(BM.heart,a,b,i%2?P.h2:P.h1));
  [[22,16],[52,2],[60,46],[2,72],[40,86],[22,110]].forEach(([a,b])=>put(BM.bow,a,b,P.bow));
  [[30,32],[12,34],[66,32],[24,58],[46,66],[8,102],[58,90],[64,2]].forEach(([a,b])=>put(BM.spark,a,b,P.sp));
  const f=document.createElement('canvas');f.width=TW*cell;f.height=TH*cell;const g=f.getContext('2d');
  const d=x.getImageData(0,0,TW,TH).data;
  for(let y=0;y<TH;y++)for(let i=0;i<TW;i++){
    const k=(y*TW+i)*4,col=toHex([d[k],d[k+1],d[k+2]]);
    g.fillStyle=col;g.fillRect(i*cell,y*cell,cell,cell);
    g.fillStyle=mix(col,'#7a1050',.16);g.fillRect(i*cell+cell-R,y*cell,R,cell);g.fillRect(i*cell,y*cell+cell-R,cell,R);
    g.fillStyle=mix(col,'#ffffff',.3);g.fillRect(i*cell,y*cell,R,R);
  }
  const rs=document.documentElement.style;
  rs.setProperty('--bgimg','url('+f.toDataURL()+')');
  rs.setProperty('--bgsize',(TW*cell/R)+'px '+(TH*cell/R)+'px');
}

/* desenho */
const view={S:2,dpr:1};
function drawPiece(c,p,a){const S=view.S;ctx.globalAlpha=a===undefined?1:a;ctx.drawImage(c,p.x0*S,p.y0*S,p.w*S,p.h*S);ctx.globalAlpha=1}
function render(now){
  const S=view.S;
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(bodyCnv,0,0,LW*S,LH*S);
  for(const p of SORTED){
    if(state.placed[p.id])drawPiece(p.cnv,p);
    else if(p.sys==='esqueleto'&&state.sys==='esqueleto')drawPiece(p.gh,p);
  }
  if(state.hint&&!state.placed[state.hint.id]){
    const p=byId[state.hint.id];
    const a=RM?.9:.55+.45*Math.sin((now||performance.now())/110);
    drawPiece(p.hi,p,a);
  }
  for(const q of particles){ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x)*S,Math.round(q.y)*S,2*S,2*S)}
}
function layout(){
  const r=board.getBoundingClientRect(),pad=14;
  view.dpr=window.devicePixelRatio||1;
  const fit=Math.min((r.width-pad*2)/LW,(r.height-pad*2)/LH);
  const S=Math.max(1,Math.floor(fit*view.dpr));
  view.S=S;cv.width=LW*S;cv.height=LH*S;
  cv.style.width=(LW*S/view.dpr)+'px';cv.style.height=(LH*S/view.dpr)+'px';
  render();
}
new ResizeObserver(layout).observe(board);

let raf=0,last=0;
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(now){
  raf=0;
  const dt=Math.min(.05,(now-last)/1000||.016);last=now;
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=50*dt;
    if(q.life<=0)particles.splice(i,1);
  }
  const hintOn=state.hint&&now<state.hint.until;
  if(state.hint&&!hintOn)state.hint=null;
  render(now);
  if(particles.length||hintOn)kick();
}
function burst(p){
  if(RM)return;
  const cols=p.s.px.filter(c=>c&&c!==OUT);
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2,sp=10+Math.random()*28;
    particles.push({x:p.cxc+(Math.random()-.5)*p.w*.6,y:p.cyc+(Math.random()-.5)*p.h*.6,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-14,life:.5+Math.random()*.5,c:cols[Math.floor(Math.random()*cols.length)]});
  }
  kick();
}

/* interface: abas, contadores, bandeja */
function updateUI(){
  $('#cnt').textContent=placedCount();
  [...meter.children].forEach((e,i)=>e.classList.toggle('on',!!state.placed[PIECES[i].id]));
  for(const k of['orgaos','esqueleto']){
    $('#t-'+k).textContent=placedCount(k)+'/'+SYSN[k];
    const t=$('#tab-'+k);t.setAttribute('aria-selected',String(state.sys===k));
    t.classList.toggle('nudge',state.sys!==k&&placedCount(state.sys)===SYSN[state.sys]&&placedCount(k)<SYSN[k]);
  }
}
function buildTray(){
  list.innerHTML='';
  const ids=state.order[state.sys].filter(id=>!state.placed[id]);
  if(!ids.length){
    const d=document.createElement('div');d.className='empty';
    d.textContent=state.sys==='orgaos'?'Todos os órgãos estão no lugar.':'Todos os ossos estão no lugar.';
    list.appendChild(d);
  }
  ids.forEach(id=>{
    const p=byId[id],b=document.createElement('button');
    b.type='button';b.className='piece'+(state.selected===id?' sel':'');b.dataset.id=id;b.setAttribute('aria-label',p.name);
    const art=document.createElement('div');art.className='art';
    const c=document.createElement('canvas');c.width=p.w;c.height=p.h;c.getContext('2d').drawImage(p.cnv,0,0);
    const k=Math.max(1,Math.min(3,Math.floor(Math.min(62/p.h,66/p.w))));
    c.style.width=p.w*k+'px';c.style.height=p.h*k+'px';
    art.appendChild(c);
    const l=document.createElement('span');l.textContent=p.name;
    b.append(art,l);list.appendChild(b);
  });
  $('#tl').textContent='Peças: '+ids.length;
}
function setSys(k){
  if(state.sys===k)return;
  state.sys=k;state.selected=null;state.hint=null;
  buildTray();updateUI();render();defaultMsg();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setSys(t.dataset.sys)));

function select(id){
  state.selected=state.selected===id?null:id;
  list.querySelectorAll('.piece').forEach(b=>b.classList.toggle('sel',b.dataset.id===state.selected));
  if(state.selected)setMsg('info',byId[id].name,'Toque no corpo, no lugar onde essa peça encaixa. Ou arraste a peça até lá.');
  else defaultMsg();
}

/* jogada */
function startTimer(){if(!state.t0)state.t0=Date.now()}
function tryPlace(id,x,y,tap){
  const p=byId[id];if(!p||state.placed[id]||state.over)return;
  const f=tap?1.3:1;
  const dx=Math.abs(x-p.cxc)/(p.tx*f),dy=Math.abs(y-p.cyc)/(p.ty*f);
  if(dx<=1&&dy<=1){
    state.placed[id]=true;state.selected=null;
    if(state.hint&&state.hint.id===id)state.hint=null;
    burst(p);buildTray();updateUI();render();
    let txt=p.fact;
    const total=placedCount();
    const sysDone=placedCount(p.sys)===SYSN[p.sys];
    if(total===TOTAL){setMsg('ok',p.name+' no lugar!','Última peça! O corpo está completo.');setTimeout(win,900);return}
    if(sysDone){
      const other=p.sys==='orgaos'?'esqueleto':'órgãos';
      setMsg('ok','Sistema completo!','Todos os '+SYS[p.sys].name+' no lugar. Falta montar o '+(p.sys==='orgaos'?'esqueleto':'os órgãos')+': toque na aba.');
      return;
    }
    setMsg('ok',p.name+' no lugar!',txt);
    return;
  }
  state.errors++;state.lives--;updateLives();
  const q=p.pair&&byId[p.pair];
  let text;
  if(q&&Math.abs(x-q.cxc)/(p.tx*f)<=1&&Math.abs(y-q.cyc)/(p.ty*f)<=1)
    text='Lado trocado! Direito e esquerdo são os do paciente: o direito dele fica à esquerda na tela.';
  else if(Math.max(dx,dy)<2)text='Está perto! Ajuste um pouco a posição.';
  else text=p.sys==='esqueleto'?'Aqui não encaixa. Compare o formato com os contornos.':'Aqui não encaixa. Use o que você sabe de anatomia ou peça uma dica.';
  if(state.lives<=0){
    state.over=true;state.selected=null;state.hint=null;
    setMsg('err','Fim de jogo','Suas 3 vidas acabaram. O '+p.name.toLowerCase()+' não vai aí.');
    setTimeout(gameOver,900);return;
  }
  setMsg('err','Não é aí · '+state.lives+(state.lives===1?' vida':' vidas'),text);
  const b=list.querySelector('.piece[data-id="'+id+'"]');
  if(b&&!RM){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
  if(!RM){board.classList.remove('bad');void board.offsetWidth;board.classList.add('bad')}
}
cv.addEventListener('click',e=>{
  if(!state.selected||state.over)return;
  startTimer();
  const r=cv.getBoundingClientRect();
  tryPlace(state.selected,(e.clientX-r.left)/r.width*LW,(e.clientY-r.top)/r.height*LH,true);
});

/* arrastar */
let drag=null;
function clearDrag(){
  if(!drag)return;
  if(drag.el)drag.el.remove();
  if(drag.btn)drag.btn.classList.remove('lifted');
  drag=null;
}
list.addEventListener('contextmenu',e=>e.preventDefault());
list.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.piece');if(!b||drag||state.over)return;
  drag={id:b.dataset.id,pid:e.pointerId,sx:e.clientX,sy:e.clientY,active:false,btn:b,touch:e.pointerType==='touch',el:null,cx:0,cy:0};
  startTimer();
});
function beginDrag(){
  const p=byId[drag.id],S=view.S,el=document.createElement('canvas');
  el.width=p.w*S;el.height=p.h*S;
  const x=el.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(p.cnv,0,0,p.w*S,p.h*S);
  drag.cw=p.w*S/view.dpr;drag.ch=p.h*S/view.dpr;
  el.style.cssText='position:fixed;left:0;top:0;pointer-events:none;z-index:60;image-rendering:pixelated;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35));width:'+drag.cw+'px;height:'+drag.ch+'px';
  document.body.appendChild(el);drag.el=el;drag.active=true;drag.btn.classList.add('lifted');
  if(state.selected&&state.selected!==drag.id){state.selected=null;list.querySelectorAll('.piece.sel').forEach(b=>b.classList.remove('sel'))}
}
function moveDrag(e){
  const off=drag.touch?-(drag.ch/2+30):0;
  drag.cx=e.clientX;drag.cy=e.clientY+off;
  drag.el.style.transform='translate('+Math.round(drag.cx-drag.cw/2)+'px,'+Math.round(drag.cy-drag.ch/2)+'px)';
}
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.active){
    if(Math.hypot(dx,dy)<8)return;
    if(drag.touch&&Math.abs(dx)>Math.abs(dy)*1.2)return;
    beginDrag();
  }
  moveDrag(e);e.preventDefault();
},{passive:false});
window.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;
  if(d.active){
    const r=cv.getBoundingClientRect(),lx=(d.cx-r.left)/r.width*LW,ly=(d.cy-r.top)/r.height*LH;
    const id=d.id;clearDrag();
    if(lx>-8&&lx<LW+8&&ly>-8&&ly<LH+8)tryPlace(id,lx,ly,false);
    else setMsg('info','Solte sobre o corpo','Leve a peça até a silhueta para encaixar.');
  }else{
    const id=d.id;clearDrag();select(id);
  }
});
window.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pid)clearDrag()});
list.addEventListener('click',e=>{ // teclado
  if(e.detail!==0)return;
  const b=e.target.closest('.piece');if(b)select(b.dataset.id);
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.selected)select(state.selected)});

/* ferramentas */
$('#b-hint').addEventListener('click',()=>{
  if(state.over)return;
  startTimer();
  const ids=state.order[state.sys].filter(id=>!state.placed[id]);
  if(!ids.length){setMsg('info','Sem peças aqui','Este sistema já está completo. Veja a outra aba.');return}
  const id=state.selected&&ids.includes(state.selected)?state.selected:ids[0];
  state.selected=id;state.hints++;
  list.querySelectorAll('.piece').forEach(b=>b.classList.toggle('sel',b.dataset.id===id));
  state.hint={id,until:performance.now()+2600};
  setMsg('info','Dica: '+byId[id].name,'O lugar da peça está piscando no corpo. Agora é só encaixar.');
  kick();
});
let resetArm=0;
$('#b-reset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!resetArm){resetArm=setTimeout(()=>{resetArm=0;b.textContent='Reiniciar'},3000);b.textContent='Certeza?';return}
  clearTimeout(resetArm);resetArm=0;b.textContent='Reiniciar';newGame();
});

/* vitória */
const winEl=$('#win');
const ENDBTN=['w-quiz','w-redo','w-again','w-close'];
function showEnd(title,text,ids){
  $('#w-title').textContent=title;$('#wp').textContent=text;
  ENDBTN.forEach(k=>$('#'+k).hidden=!ids.includes(k));
  winEl.hidden=false;$('#'+ids[0]).focus();
}
function win(){
  const s=Math.round((Date.now()-(state.t0||Date.now()))/1000),m=Math.floor(s/60),ss=String(s%60).padStart(2,'0');
  showEnd('Fase 1 completa!','Você encaixou as '+TOTAL+' peças com '+state.errors+(state.errors===1?' erro':' erros')+' e '+state.hints+(state.hints===1?' dica':' dicas')+', em '+m+':'+ss+'. Agora teste o que aprendeu!',['w-quiz','w-again','w-close']);
}
function gameOver(){
  showEnd('Fim de jogo','Você errou 3 vezes. Encaixou '+placedCount()+' de '+TOTAL+' peças.',['w-again']);
}
$('#w-close').addEventListener('click',()=>{winEl.hidden=true});
$('#w-again').addEventListener('click',()=>{winEl.hidden=true;quizEl.hidden=true;newGame()});

/* fase 2: quiz */
const QUIZ=[
 {q:'Quanto pesa, em média, o cérebro humano?',o:['Cerca de 1,4 kg','Cerca de 4 kg','Cerca de 400 g'],f:'cerebro'},
 {q:'Quantos lobos tem o pulmão direito?',o:['3 lobos','2 lobos','4 lobos'],f:'pulmaoD'},
 {q:'Quantas vezes o coração bate por dia, mais ou menos?',o:['Cerca de 100 mil','Cerca de 10 mil','Cerca de 1 milhão'],f:'coracao'},
 {q:'O que é o fígado, em tamanho, no corpo humano?',o:['A maior glândula do corpo','O maior músculo do corpo','O maior osso do corpo'],f:'figado'},
 {q:'Por que o rim direito fica um pouco mais baixo que o esquerdo?',o:['Por causa do fígado','Por causa do coração','Por causa do estômago'],f:'rimD'},
 {q:'Quantos litros por dia os dois rins filtram?',o:['Cerca de 180 litros','Cerca de 18 litros','Cerca de 1 litro'],f:'rimE'},
 {q:'Quanto mede o intestino delgado?',o:['Uns 6 metros','Uns 1,5 metro','Uns 60 centímetros'],f:'delgado'},
 {q:'Qual é o único osso do crânio que se move?',o:['A mandíbula','O osso frontal','O osso parietal'],f:'cranio'},
 {q:'Quantos pares de costelas o corpo humano tem?',o:['12 pares','7 pares','24 pares'],f:'costelas'},
 {q:'Qual é o maior e mais forte osso do corpo?',o:['O fêmur','A tíbia','O úmero'],f:'femurD'}
];
const quizEl=$('#quiz'),qMeter=$('#q-meter');
const quiz={list:[],i:0,score:0,res:[]};
for(let i=0;i<QUIZ.length;i++){const e=document.createElement('i');qMeter.appendChild(e)}
function startQuiz(){
  winEl.hidden=true;
  quiz.list=shuffle(QUIZ.slice());quiz.i=0;quiz.score=0;quiz.res=[];
  [...qMeter.children].forEach(e=>{e.className=''});
  quizEl.hidden=false;showQuestion();
}
function showQuestion(){
  const q=quiz.list[quiz.i];
  $('#q-n').textContent='Pergunta '+(quiz.i+1)+'/'+quiz.list.length;
  $('#q-s').textContent='Acertos: '+quiz.score;
  $('#q-q').textContent=q.q;$('#q-fb').textContent='';$('#q-next').hidden=true;
  const opts=$('#q-opts');opts.innerHTML='';
  shuffle(q.o.map((t,k)=>({t,ok:k===0}))).forEach(op=>{
    const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=op.t;b.dataset.ok=op.ok?'1':'';
    b.addEventListener('click',()=>answer(b,op.ok));opts.appendChild(b);
  });
  opts.firstChild.focus({preventScroll:true});
}
function answer(btn,ok){
  const q=quiz.list[quiz.i],fact=byId[q.f].fact;
  const all=[...$('#q-opts').children];
  all.forEach(b=>{b.disabled=true;if(b.dataset.ok)b.classList.add('right')});
  if(ok)quiz.score++;else btn.classList.add('wrong');
  qMeter.children[quiz.i].className=ok?'ok':'no';
  $('#q-s').textContent='Acertos: '+quiz.score;
  $('#q-fb').textContent=(ok?'Certo! ':'Resposta certa: '+q.o[0]+'. ')+fact;
  const n=$('#q-next');n.textContent=quiz.i===quiz.list.length-1?'Ver resultado':'Próxima';n.hidden=false;n.focus({preventScroll:true});
}
$('#q-next').addEventListener('click',()=>{
  if(quiz.i<quiz.list.length-1){quiz.i++;showQuestion();return}
  quizEl.hidden=true;
  const n=quiz.list.length,sc=quiz.score;
  const nota=sc===n?'Perfeito! Você é um(a) anatomista nota 10.':sc>=8?'Excelente! Você aprendeu muito.':sc>=5?'Bom trabalho! Jogue de novo para fixar as curiosidades.':'Vale rever as curiosidades e tentar de novo.';
  showEnd('Quiz concluído!','Você acertou '+sc+' de '+n+'. '+nota,['w-redo','w-again','w-close']);
});
$('#w-quiz').addEventListener('click',startQuiz);
$('#w-redo').addEventListener('click',startQuiz);

/* novo jogo */
function newGame(){
  state.placed={};state.selected=null;state.errors=0;state.hints=0;state.lives=3;state.over=false;state.t0=0;state.hint=null;state.sys='orgaos';
  particles.length=0;
  state.order.orgaos=shuffle(PIECES.filter(p=>p.sys==='orgaos').map(p=>p.id));
  state.order.esqueleto=shuffle(PIECES.filter(p=>p.sys==='esqueleto').map(p=>p.id));
  buildTray();updateUI();updateLives();render();
  setMsg('info','Como jogar','Sem contornos nos órgãos e só 3 vidas. Direito e esquerdo são os do paciente.');
}
newGame();
})();
</script>
